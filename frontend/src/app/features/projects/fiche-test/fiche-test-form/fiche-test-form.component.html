<div *ngIf="isLoading" class="flex justify-center items-center py-12">
  <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary"></div>
</div>

<form *ngIf="!isLoading" [formGroup]="testForm" (ngSubmit)="onSubmit()" class="space-y-6 animate-fade-in relative z-10 w-full mx-auto pb-10">
  
  <!-- Entête de la Fiche -->
  <div class="glass-card shadow-lg shadow-primary/5">
    <!-- Gradient Decoration -->
    <div class="absolute inset-x-0 top-0 h-2 bg-gradient-to-r from-primary via-accent to-purple-500"></div>
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
    
    <div class="flex items-center gap-3 mb-8 pb-4 border-b border-gray-100 dark:border-white/10 relative z-10">
      <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">
        <mat-icon class="text-primary">science</mat-icon>
      </div>
      <div>
        <h2 class="text-xl font-black text-gray-800 dark:text-white">Plan de Validations & Tests</h2>
        <p class="text-xs text-gray-500 font-medium tracking-wider uppercase mt-1">Conformité Qualité</p>
      </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 relative z-10">
      <div class="space-y-2 relative group w-full">
        <label class="fiche-label">Application</label>
        <div class="relative">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">web</mat-icon>
          <input type="text" formControlName="application" class="input-field" placeholder="Ex: Portail Client">
        </div>
      </div>
      <div class="space-y-2 relative group w-full">
        <label class="fiche-label">Version</label>
        <div class="relative">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">tag</mat-icon>
          <input type="text" formControlName="version" class="input-field" placeholder="Ex: 1.0.0">
        </div>
      </div>
      <div class="space-y-2 relative group w-full">
        <label class="fiche-label">Date de version</label>
        <div class="relative">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">event</mat-icon>
          <input type="date" formControlName="dateVersion" class="input-field">
        </div>
      </div>
      <div class="space-y-2 relative group w-full">
        <label class="fiche-label">Architecture</label>
        <div class="relative">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">dns</mat-icon>
          <select formControlName="architecture" class="input-field appearance-none">
            <option value="Client/serveur">Client/serveur</option>
            <option value="3-tiers">3-tiers</option>
          </select>
        </div>
      </div>
      <div class="space-y-2 relative group w-full lg:col-span-2">
        <label class="fiche-label">Note Affectation (Date & Réf)</label>
        <div class="relative flex gap-4">
          <div class="relative flex-1">
             <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">assignment</mat-icon>
             <input type="date" formControlName="dateNoteServiceAffectation" class="input-field w-full">
          </div>
          <div class="relative flex-1">
             <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">calendar_today</mat-icon>
             <input type="date" formControlName="dateDemandeEnvTest" class="input-field w-full" title="Demande Env. Test">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sections de Test (Fonctionnel, Sécurité, Qualité) -->
  <ng-container *ngFor="let section of ['testFonctionnel', 'testSecurite', 'testQualite']; let i = index">
    <div class="glass-card shadow-lg" [formGroupName]="section">
      
      <!-- Section Header -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b border-gray-100 dark:border-white/10 gap-4 relative z-10">
        <div class="flex items-center gap-3">
          <div [ngClass]="{
            'bg-blue-500/10 text-blue-500': section === 'testFonctionnel',
            'bg-red-500/10 text-red-500': section === 'testSecurite',
            'bg-green-500/10 text-green-500': section === 'testQualite'
          }" class="w-10 h-10 rounded-xl flex items-center justify-center">
            <mat-icon *ngIf="section === 'testFonctionnel'">touch_app</mat-icon>
            <mat-icon *ngIf="section === 'testSecurite'">shield</mat-icon>
            <mat-icon *ngIf="section === 'testQualite'">verified</mat-icon>
          </div>
          <div>
            <h3 class="text-md font-bold text-gray-900 dark:text-white uppercase tracking-widest">
              <span *ngIf="section === 'testFonctionnel'">Test Fonctionnel</span>
              <span *ngIf="section === 'testSecurite'">Test Sécurité</span>
              <span *ngIf="section === 'testQualite'">Test Qualité</span>
            </h3>
          </div>
        </div>
        
        <!-- Responsable Section Header -->
        <div class="w-full md:w-1/3 relative group">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">person</mat-icon>
          <input type="text" formControlName="responsable" class="input-field" placeholder="Superviseur des tests...">
        </div>
      </div>

      <!-- Lignes Array -->
      <div formArrayName="lignes" class="space-y-4">
        <div *ngFor="let ligne of getLignes(section).controls; let j = index" [formGroupName]="j" 
             class="test-row-card flex flex-col md:flex-row items-end md:items-center gap-4 group animate-fade-in relative">
             
          <div class="grid grid-cols-2 md:flex md:w-48 gap-3">
            <div class="w-full">
              <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1 ml-1">Début</label>
              <input type="date" formControlName="dateDebut" class="w-full rounded-lg border-gray-200 py-2 px-3 text-xs bg-white/50 focus:ring-primary focus:border-primary">
            </div>
            <div class="w-full">
              <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1 ml-1">Fin</label>
              <input type="date" formControlName="dateFin" class="w-full rounded-lg border-gray-200 py-2 px-3 text-xs bg-white/50 focus:ring-primary focus:border-primary">
            </div>
          </div>
          
          <div class="w-20 flex flex-col items-center justify-center">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-2">Validé</label>
            <div class="relative w-6 h-6 flex items-center justify-center">
              <input type="checkbox" formControlName="valide" class="w-5 h-5 rounded cursor-pointer border-gray-300 text-primary focus:ring-primary bg-white transition hover:scale-110">
            </div>
          </div>
          
          <div class="flex-1 w-full relative">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1 ml-1">Observations / Remarques</label>
            <textarea formControlName="observations" rows="1" class="w-full rounded-lg border-gray-200 py-2 px-3 text-sm bg-white/50 focus:ring-primary focus:border-primary resize-none" placeholder="Constats..."></textarea>
          </div>
          
          <div class="w-full md:w-48 relative">
            <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1 ml-1">Testeur / Signataire</label>
            <input type="text" formControlName="signataire" class="w-full rounded-lg border-gray-200 py-2 px-3 text-sm bg-white/50 focus:ring-primary focus:border-primary" placeholder="Nom Prénom">
          </div>
          
          <button type="button" (click)="removeLigne(section, j)" 
                  class="absolute -right-2 -top-2 bg-rose-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-all hover:scale-110 hover:bg-rose-600 shadow-md transform translate-y-1 group-hover:translate-y-0">
            <mat-icon class="text-sm">close</mat-icon>
          </button>
        </div>
      </div>
      
      <div class="mt-5 flex justify-center">
         <button type="button" (click)="addLigne(section)" class="flex items-center px-4 py-2 text-xs font-bold uppercase tracking-widest text-primary bg-primary/5 hover:bg-primary/10 rounded-full transition-colors border border-primary/20">
            <mat-icon class="text-sm mr-2 text-primary">add_circle</mat-icon> Nouvelle Phase
         </button>
      </div>
    </div>
  </ng-container>

  <!-- Approbation Finale -->
  <div class="glass-card shadow-lg bg-gradient-to-br from-white/90 to-primary/5 dark:from-gray-900 dark:to-primary/10">
    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-200/50 dark:border-white/10 relative z-10">
      <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center">
        <mat-icon class="text-emerald-500">task_alt</mat-icon>
      </div>
      <div>
        <h3 class="text-lg font-bold text-gray-900 dark:text-white uppercase tracking-wider">Validation Finale</h3>
      </div>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5 relative z-10">
      <div class="space-y-2 relative group w-full">
        <label class="fiche-label">Responsable Approbation (RA)</label>
        <div class="relative">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">military_tech</mat-icon>
          <input type="text" formControlName="responsableValidation" class="input-field" placeholder="Directeur / Manager">
        </div>
      </div>
      <div class="space-y-2 relative group w-full">
        <label class="fiche-label">Nom du signataire</label>
        <div class="relative">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">draw</mat-icon>
          <input type="text" formControlName="signatureResponsable" class="input-field" placeholder="Ex: Jean Dupont">
        </div>
      </div>
      <div class="space-y-2 relative group w-full">
        <label class="fiche-label">Date Validation</label>
        <div class="relative">
          <mat-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors text-[20px]">event_available</mat-icon>
          <input type="date" formControlName="dateValidation" class="input-field">
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-4 pt-4 sticky bottom-4 z-50">
    <button type="submit" [disabled]="isSaving" class="btn-primary shadow-2xl">
      <mat-icon *ngIf="!isSaving" class="mr-2">cloud_upload</mat-icon>
      <mat-icon *ngIf="isSaving" class="mr-2 animate-spin">refresh</mat-icon>
      {{ isSaving ? 'Sauvegarde...' : 'Finaliser la Fiche de Test' }}
    </button>
  </div>
</form>
