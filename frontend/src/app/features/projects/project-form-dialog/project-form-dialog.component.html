<div class="flex flex-col h-full bg-white dark:bg-slate-900 border-none rounded-2xl overflow-hidden shadow-2xl">
  <!-- Modern Header with Gradient -->
  <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-800 px-8 py-8 relative overflow-hidden shrink-0">
    <!-- Decorative background elements -->
    <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10 blur-2xl"></div>
    <div class="absolute bottom-0 left-1/4 w-24 h-24 rounded-full bg-blue-400 opacity-20 blur-xl"></div>
    
    <div class="relative z-10 flex items-start gap-5">
      <div class="p-3 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-inner flex items-center justify-center">
        <mat-icon class="text-white transform scale-125">auto_awesome</mat-icon>
      </div>
      <div>
        <h2 mat-dialog-title class="!m-0 text-2xl md:text-3xl font-extrabold text-white tracking-tight drop-shadow-sm">
          {{ data.project ? 'Modifier le Projet' : 'Nouveau Projet Qualité' }}
        </h2>
        <p class="text-blue-100 mt-1.5 text-sm md:text-base font-medium max-w-sm">
          {{ data.project ? 'Mettez à jour les informations de ce projet de suivi.' : 'Définissez les paramètres initiaux pour lancer le suivi.' }}
        </p>
      </div>
    </div>
  </div>

  <mat-dialog-content class="!p-8 !pt-8 !pb-6 custom-scrollbar flex-grow bg-gray-50/30 dark:bg-slate-900/50">
    <form [formGroup]="projectForm" class="space-y-6">
      
      <!-- Nom du Projet -->
      <div class="space-y-2">
        <label class="text-xs font-black text-gray-500 uppercase tracking-widest flex items-center gap-2">
          <mat-icon class="scale-75 text-primary">title</mat-icon> Nom du Projet <span class="text-red-500">*</span>
        </label>
        <input type="text" formControlName="nomProjet" class="input-field" placeholder="Ex: Déploiement Norme ISO 9001">
        <div *ngIf="projectForm.get('nomProjet')?.hasError('required') && projectForm.get('nomProjet')?.touched" class="text-red-500 text-xs font-semibold mt-1">
          Le nom du projet est requis
        </div>
      </div>

      <!-- Description -->
      <div class="space-y-2">
        <label class="text-xs font-black text-gray-500 uppercase tracking-widest flex items-center gap-2">
          <mat-icon class="scale-75 text-accent">description</mat-icon> Description détaillée <span class="text-red-500">*</span>
        </label>
        <textarea formControlName="description" rows="3" class="input-field resize-none" placeholder="Décrivez le périmètre et le contexte..."></textarea>
      </div>

      <!-- Dates Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label class="text-xs font-black text-gray-500 uppercase tracking-widest flex items-center gap-2">
            <mat-icon class="scale-75 text-blue-500">event</mat-icon> Date de Début <span class="text-red-500">*</span>
          </label>
          <input type="date" formControlName="dateDebut" class="input-field">
        </div>
        <div class="space-y-2">
          <label class="text-xs font-black text-gray-500 uppercase tracking-widest flex items-center gap-2">
            <mat-icon class="scale-75 text-blue-500">event_available</mat-icon> Date de Fin Prévue <span class="text-red-500">*</span>
          </label>
          <input type="date" formControlName="dateFinPrevue" class="input-field">
        </div>
      </div>

      <!-- Statut du Projet -->
      <div class="space-y-2 p-5 rounded-2xl bg-white dark:bg-white/5 border border-gray-100 dark:border-white/10 shadow-sm">
        <label class="text-xs font-black text-gray-500 uppercase tracking-widest flex items-center gap-2 mb-3">
          <mat-icon class="scale-75 text-warning">data_usage</mat-icon> Statut du Projet <span class="text-red-500">*</span>
        </label>
        <select formControlName="statut" class="input-field !bg-gray-50 dark:!bg-slate-800 font-bold text-gray-700 dark:text-gray-200 cursor-pointer border-gray-200 hover:border-warning/50 focus:border-warning focus:ring-warning/20">
          <option value="NOUVEAU">🆕 NOUVEAU</option>
          <option value="EN COURS">🔄 EN COURS</option>
          <option value="EN RETARD">⚠️ EN RETARD</option>
          <option value="TERMINÉ">✅ TERMINÉ</option>
        </select>
      </div>

      <!-- Objectifs -->
      <div class="space-y-2">
        <label class="text-xs font-black text-gray-500 uppercase tracking-widest flex items-center gap-2">
          <mat-icon class="scale-75 text-success">track_changes</mat-icon> Objectifs Principaux <span class="text-red-500">*</span>
        </label>
        <textarea formControlName="objectifs" rows="2" class="input-field resize-none" placeholder="Ex: Réduire le taux de non-conformité de 15%"></textarea>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="!p-6 !pt-5 bg-gray-50/80 dark:bg-slate-800/80 backdrop-blur-md border-t border-gray-200 dark:border-slate-700 flex justify-end gap-4 shrink-0">
    <button mat-stroked-button color="warn" class="!rounded-xl !px-6 !py-2.5 font-bold hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors" (click)="onCancel()" type="button">
      Annuler
    </button>
    <button mat-flat-button color="primary" class="!rounded-xl !px-8 !py-2.5 font-black uppercase tracking-widest shadow-xl shadow-blue-500/30 transition-all hover:shadow-blue-500/50 hover:-translate-y-1" [disabled]="projectForm.invalid" (click)="onSave()" type="button">
      <mat-icon class="mr-2 scale-90">save</mat-icon>
      Enregistrer
    </button>
  </mat-dialog-actions>
</div>
